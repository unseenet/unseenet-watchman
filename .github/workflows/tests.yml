name: tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    # Against unseenet main for now: spam reports arrive with core 0.6.0. Once it is
    # released the dependency becomes "unseenet>=0.6,<0.7" and a core-main job is added,
    # as in the other repositories.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e ".[dev]"
      - run: pytest -q
