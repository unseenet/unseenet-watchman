name: release
# Push a tag like v0.1.0 to release (v0.1.1a1 for a test release: PyPI and GitHub
# mark it as a pre-release). The tag must match __version__ and, for a full
# release, have a section in CHANGELOG.md, which becomes the release notes - the
# shared release workflows (unseenet/unseenet#545).
# Versioning as in unseenet: https://github.com/unseenet/unseenet/blob/main/docs/development.md#versioning
#
# Each release also carries unseenet-watchman-<version>-server-requirements.txt and
# SHA256SUMS.txt. Once the project key has signed them (tools/project/sign_release.py
# --repo unseenet-watchman <tag> in unseenet/unseenet), servers running watchman update
# to it by themselves (unseenet/unseenet#827, UN-RFC 0062 section 6.1).
on:
  push:
    tags: ["v*"]

jobs:
  build:
    uses: unseenet/.github/.github/workflows/release-build.yml@main
    with:
      package: unseenet_watchman
      server: true
      setup: |                   # the core comes from PyPI, not git (PyPI refuses direct URLs)
        if grep -n -E '^\s*"unseenet @ git\+' pyproject.toml; then
          echo "pyproject.toml still names the core by git URL: release the core first," >&2
          echo "then depend on it as \"unseenet>=X.Y,<X.Z\"" >&2; exit 1
        fi

  pypi:                        # here: PyPI's trusted publishing does not take reusable workflows
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/unseenet-watchman
    permissions:
      id-token: write          # trusted publishing: no API token stored anywhere
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github:
    needs: pypi
    uses: unseenet/.github/.github/workflows/release-github.yml@main
    with:
      title: "Unseenet watchman"
      server: true
    permissions:
      contents: write
