# unseenet-watchman: copy to watchman.toml and adjust.

[watchman]
vault = "~/.local/share/unseenet-watchman/watchman.vault"
state_file = "~/.local/state/unseenet-watchman/state.json"
# nodes = ["xxxxxxxx.onion"]      # default: the known-node list
# Beside a node, read it directly - no Tor, every fetch in milliseconds (set
# tor_socks then: the blocklists are still asked through Tor). See the README
# for what that means for a node that wants to stay hidden.
# nodes = ["127.0.0.1:1119"]
# Nothing is published until this is true. Run a while with it false and read the
# log: every batch is written there as the report it would have been.
publish = false
sweep_minutes = 60               # a full look now and then; new posts come by push
batch_minutes = 60               # how often it publishes what it found
groups = ["*"]                   # group names to read (patterns, the part before @)
skip_groups = ["unseenet.test*"] # e.g. groups where odd posts are the point
# contact = "inbox@..."          # where to object; default: the issuer's own inbox
# tor_socks = "127.0.0.1:9050"   # default: the Tor the watchman reads the nodes with;
                                 # every blocklist lookup goes through Tor either way
# doh = "https://dns.google/resolve"   # the DNS-over-HTTPS resolver, reached through Tor
# spamhaus_dqs_key = "..."       # turns Spamhaus DBL on (its free DQS key)

[rules]
wave_keys = 5        # the same text from this many keys: spam
flood_groups = 5     # the same text from one key in this many groups: flood
key_after = 3        # findings about one key before the key itself is reported ...
key_window = 7       # ... within this many days
key_days = 30        # how long a key report lasts (at most 365)
allow_keys = []      # never reported: the project's bots, for one
allow_domains = ["unseenet.org", "unseenet.net", "github.com", "wikipedia.org",
                 "torproject.org"]

# Blocklists are asked through Tor with DNS-over-HTTPS: plain DNS through Tor drops
# every blocklist answer (they are 127.0.0.x addresses). Each list's test point is
# looked up at start and every 6 hours; a list that fails it is paused and logged.
# Default lists: SURBL (works through public DoH). Spamhaus DBL refuses public
# resolvers, and is turned on with a free DQS key (spamhaus_dqs_key above).
# Or replace the lists entirely ([[zone]], each with its test point). Check each
# list's terms: several are free only for small, non-commercial use.
#
# [[zone]]
# name = "multi.surbl.org"
# bits = { 8 = "phishing", 16 = "malware", 64 = "spam", 128 = "malware" }
# refused = ["127.0.0.1"]
# test = "surbl-org-permanent-test-point.com"
