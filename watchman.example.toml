# unseenet-watchman: copy to watchman.toml and adjust.

[watchman]
vault = "~/.local/share/unseenet-watchman/watchman.vault"
state_file = "~/.local/state/unseenet-watchman/state.json"
# nodes = ["xxxxxxxx.onion"]      # default: the known-node list
# Nothing is published until this is true. Run a while with it false and read the
# log: every batch is written there as the report it would have been.
publish = false
interval_minutes = 10            # how often it looks
batch_minutes = 60               # how often it publishes what it found
groups = ["*"]                   # group names to read (patterns, the part before @)
skip_groups = ["unseenet.test*"] # e.g. groups where odd posts are the point
# contact = "inbox@..."          # where to object; default: the issuer's own inbox
tor_socks = "127.0.0.1:9050"     # every blocklist lookup goes through Tor

[rules]
wave_keys = 5        # the same text from this many keys: spam
flood_groups = 5     # the same text from one key in this many groups: flood
key_after = 3        # findings about one key before the key itself is reported ...
key_window = 7       # ... within this many days
key_days = 30        # how long a key report lasts (at most 365)
allow_keys = []      # never reported: the project's bots, for one
allow_domains = ["unseenet.org", "unseenet.net", "github.com", "wikipedia.org",
                 "torproject.org"]

# URI blocklists. Leave these out to use the defaults (Spamhaus DBL and SURBL; URIBL
# off). Check each list's terms: several are free only for small, non-commercial use.
# Spamhaus may refuse lookups through Tor exits; with a free DQS key, use its zone
# instead ("<key>.dbl.dq.spamhaus.net") with the same codes.
#
# [[zone]]
# name = "dbl.spamhaus.org"
# codes = { "127.0.1.2" = "spam", "127.0.1.4" = "phishing", "127.0.1.5" = "malware" }
# refused = ["127.255.255.252", "127.255.255.254", "127.255.255.255"]
#
# [[zone]]
# name = "multi.surbl.org"
# bits = { 8 = "phishing", 16 = "malware", 64 = "spam", 128 = "malware" }
# refused = ["127.0.0.1"]
