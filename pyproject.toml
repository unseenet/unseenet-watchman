[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "unseenet-watchman"
dynamic = ["version"]
description = "Reads Unseenet's open groups and publishes spam reports (UN-RFC 0045) that readers and nodes may choose to follow"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Andreas Lorensen" }]
requires-python = ">=3.11"
dependencies = [
    "unseenet>=0.6,<0.7",   # one minor version of the core at a time (0.6.1.devN on core main is below 0.6.1)
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]
# Better language detection for labels (about 170 MB, 40 MB in memory for nine
# languages); the core's unseenet.core.language uses it when installed
lingua = ["lingua-language-detector>=2.2"]

[project.scripts]
unseenet-watchman = "unseenet_watchman.runner:main"

[project.urls]
Homepage = "https://github.com/unseenet/unseenet-watchman"

[tool.setuptools.dynamic]
version = { attr = "unseenet_watchman.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
unseenet_watchman = ["wordlists/*.txt", "wordlists/SOURCE.md"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
asyncio_mode = "auto"
